<script>
(function(){

var de=document.documentElement,vh=window.innerHeight||800;
if('IntersectionObserver' in window){
var els=[].slice.call(document.querySelectorAll('.two>div,.wrap>h2,.wrap>.sub,.stages li,.atwork figure,.details figure,.fin figure'));
function pos(t){var p=t.parentElement,sib=[].slice.call(p.children).filter(function(x){return x.tagName===t.tagName&&x.offsetParent}),r=t.getBoundingClientRect(),col=0;sib.forEach(function(x){if(x!==t){var q=x.getBoundingClientRect();if(Math.abs(q.top-r.top)<8&&q.left*(document.documentElement.dir==='rtl'?-1:1)<r.left*(document.documentElement.dir==='rtl'?-1:1))col++}});return {col:col,top:r.top,left:r.left}}
var STAGGER_STEP=120,STAGGER_MAX=5;
var io=new IntersectionObserver(function(en){var hit=en.filter(function(e){return e.isIntersecting}).map(function(e){var o=pos(e.target);o.t=e.target;return o}).sort(function(a,b){return a.top-b.top||a.col-b.col});var rows=[],rk={};hit.forEach(function(o){var key=Math.round(o.top/10);if(rk[key]===undefined){rk[key]=rows.length;rows.push(key)}var i=Math.min(STAGGER_MAX,o.col+rk[key]);o.t.style.transitionDelay=(i*STAGGER_STEP)+'ms';o.t.classList.add('in');io.unobserve(o.t)})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach(function(el){if(el.getBoundingClientRect().top<vh*.9)return;el.classList.add('rv');io.observe(el)})}
var fin=document.querySelector('.fin figure'),tick=false;
function upd(){tick=false;var y=window.pageYOffset||0;de.style.setProperty('--py',Math.min(y*.1,260).toFixed(1)+'px');
if(fin&&innerWidth>=900){var r=fin.getBoundingClientRect(),p=(r.top+r.height/2-vh/2)/vh;p=Math.max(-1,Math.min(1,p));fin.style.transform='translate3d(0,'+(p*-14).toFixed(1)+'px,0)'}}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
